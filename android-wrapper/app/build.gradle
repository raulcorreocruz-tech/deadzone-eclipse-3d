plugins {
    id 'com.android.application' version '8.7.3'
}
android {
    namespace 'com.deadzone.eclipse'
    compileSdk 35

    defaultConfig {
        applicationId 'com.deadzone.eclipse'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '5.22.0-android-preview'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
