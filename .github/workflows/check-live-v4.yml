name: Verificar compilación exacta en Render y APK
on:
  push:
    branches: [main]
    paths: ["setup.cjs", "gameplay-v39.cjs", "gameplay-v40.cjs", "gameplay-v41.cjs", "gameplay-v42.cjs", "gameplay-v43.cjs", "gameplay-v44.cjs", "gameplay-v45.cjs", "gameplay-v46.cjs", "gameplay-v47.cjs", "gameplay-v48.cjs", "custom-hud-v45.js", "custom-hud-v45.css", "package.json", ".github/workflows/check-live-v4.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Calcular huella de la versión
        id: expected
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const files=['package.json','setup.cjs','gameplay-v39.cjs','gameplay-v40.cjs','gameplay-v41.cjs','gameplay-v42.cjs','gameplay-v43.cjs','gameplay-v44.cjs','gameplay-v45.cjs','gameplay-v46.cjs','gameplay-v47.cjs','gameplay-v48.cjs','custom-hud-v45.js','custom-hud-v45.css'];
          const h=crypto.createHash('sha256');
          for(const f of files){h.update(f);h.update(fs.readFileSync(f))}
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'build='+JSON.parse(fs.readFileSync('package.json')).version+'-'+h.digest('hex').slice(0,12)+'\n');
          NODE
      - name: Verificar web exacta y recursos de Render
        id: probe
        env:
          EXPECTED: ${{ steps.expected.outputs.build }}
        run: |
          set -euo pipefail
          SUCCESS=no
          LAST=unknown
          for i in $(seq 1 42); do
            if curl -fsSL --compressed --max-time 18 -H 'Cache-Control: no-cache' "https://deadzone-eclipse-coop.onrender.com/?check=${GITHUB_RUN_ID}_${i}" -o /tmp/game.html; then
              LAST=$(node -e 'const s=require("fs").readFileSync("/tmp/game.html","utf8");console.log(s.match(/<meta name="deadzone-build" content="([^"]+)"/)?.[1]||"missing")')
              if [ "$LAST" = "$EXPECTED" ] && curl -fsS --max-time 18 https://deadzone-eclipse-coop.onrender.com/health -o /tmp/health && curl -fsS --max-time 18 https://deadzone-eclipse-coop.onrender.com/assets/zombie_mummy.glb -o /tmp/model && [ "$(head -c 4 /tmp/model)" = glTF ] && grep -q "id=\"dz45-runtime\"" /tmp/game.html && grep -q "deadzone_touch_layout_v45" /tmp/game.html && grep -q "DEAD_ZONE_PATCH_48" /tmp/game.html; then SUCCESS=yes;break; fi
            fi
            echo "Intento $i/42: esperado=$EXPECTED actual=$LAST"
            sleep 10
          done
          echo "actual=$LAST" >> "$GITHUB_OUTPUT"
          echo "verified=$SUCCESS" >> "$GITHUB_OUTPUT"
          test "$SUCCESS" = yes
      - name: Registrar resultado del despliegue
        if: always()
        env:
          EXPECTED: ${{ steps.expected.outputs.build }}
          ACTUAL: ${{ steps.probe.outputs.actual }}
          VERIFIED: ${{ steps.probe.outputs.verified }}
        run: |
          node -e 'const fs=require("fs");fs.writeFileSync("production-build-verification.json",JSON.stringify({expected:process.env.EXPECTED,actual:process.env.ACTUAL||null,verified:process.env.VERIFIED==="yes",runId:process.env.GITHUB_RUN_ID,commit:process.env.GITHUB_SHA,checkedAt:new Date().toISOString()},null,2)+"\n")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadzone-deployment-proof
          path: production-build-verification.json
          if-no-files-found: error
