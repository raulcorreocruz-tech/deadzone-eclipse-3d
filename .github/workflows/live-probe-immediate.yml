name: Estado inmediato de DEAD ZONE en Render
on:
  push:
    paths:
      - ".github/workflows/live-probe-immediate.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Consultar versión que recibe la APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HTTP=$(curl -L --max-time 28 -sS -w "%{http_code}" "https://deadzone-eclipse-coop.onrender.com/?probe=$(date +%s)" -o /tmp/game.html || true)
          VERSION="unknown"
          if grep -q 'DEAD_ZONE_PATCH_43' /tmp/game.html; then VERSION="4.3"
          elif grep -q 'DEAD_ZONE_PATCH_42' /tmp/game.html; then VERSION="4.2"
          elif grep -q 'DEAD_ZONE_PATCH_41' /tmp/game.html; then VERSION="4.1"
          elif grep -q 'DEAD_ZONE_PATCH_40' /tmp/game.html; then VERSION="4.0"
          elif grep -q 'DEAD_ZONE_PATCH_39' /tmp/game.html; then VERSION="3.9"
          fi
          curl -L --max-time 20 -s -o /tmp/zombie.glb -w "%{http_code}" "https://deadzone-eclipse-coop.onrender.com/assets/zombie_mummy.glb" >/tmp/modelcode || true
          FIXES="no"
          if grep -Fq '#cameraHelp{display:none!important}' /tmp/game.html && grep -Fq 'const zoom=MOBILE_MODE?.73:' /tmp/game.html; then FIXES="yes"; fi
          echo "LIVE STATUS HTTP=$HTTP VERSION=$VERSION FIXES=$FIXES MODEL_HTTP=$(cat /tmp/modelcode)"
          VERSION="$VERSION" HTTP="$HTTP" FIXES="$FIXES" MODEL_HTTP="$(cat /tmp/modelcode)" node -e 'const fs=require("fs");fs.writeFileSync("/tmp/live.json",JSON.stringify({liveVersion:process.env.VERSION,latestMobileFixes:process.env.FIXES==="yes",http:process.env.HTTP,modelHttp:process.env.MODEL_HTTP,checkedAt:new Date().toISOString()},null,2)+"\n")'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadzone-live-probe
          path: /tmp/live.json
          if-no-files-found: ignore
