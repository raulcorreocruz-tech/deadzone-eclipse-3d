name: Diagnostic Android gameplay startup (live)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/smoke-live-mobile.mjs'
      - '.github/workflows/smoke-live-mobile.yml'
      - 'gameplay-v526.cjs'
      - 'gameplay-v527.cjs'
      - 'gameplay-v528.cjs'
      - 'gameplay-v529.cjs'
      - 'gameplay-v530.cjs'
      - 'gameplay-v531.cjs'
      - 'assets/deadzone_playables_6x4.png'
      - 'assets/peter_griffin_atlas.png'
      - 'gameplay-v525.cjs'
      - 'package.json'
permissions:
  contents: read
jobs:
  android-browser-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          command -v google-chrome
          google-chrome --version
      - name: Inspect live game on Android and desktop
        run: node tests/smoke-live-mobile.mjs
