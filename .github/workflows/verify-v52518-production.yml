name: Verify production v5.25.18 Supabase and browser
on:
  push:
    branches: ["verify/production-v52518-supabase-20261118"]
    paths:
      - "tests/verify-v52518-prod-api.mjs"
      - "tests/verify-v52518-prod-browser.mjs"
      - ".github/workflows/verify-v52518-production.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Check live version, durable database writes, accounts and friends
        run: node tests/verify-v52518-prod-api.mjs
      - name: Check browser PC and Android
        run: |
          npm install --no-save playwright@1.56.1 --no-audit --no-fund
          node tests/verify-v52518-prod-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-v52518-screenproof
          path: production-v52518-*.png
          if-no-files-found: ignore
