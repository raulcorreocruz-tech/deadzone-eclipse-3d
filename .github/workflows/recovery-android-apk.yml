name: Build APK for recovered DEAD ZONE v5.25.24
on:
  workflow_dispatch:
  push:
    branches: [recovery-gateway]
    paths:
      - 'android-wrapper/app/src/main/java/com/deadzone/eclipse/MainActivity.java'
      - '.github/workflows/recovery-android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Pin recovery Android version and URL
        run: |
          node android-wrapper/sync-version.cjs
          sed -i "s/versionCode 5025024/versionCode 5025025/" android-wrapper/app/build.gradle
          sed -i "s/versionName '5.25.24'/versionName '5.25.24-recovery'/" android-wrapper/app/build.gradle
          grep -q 'deadzone-eclipse-coop-recovery.onrender.com' android-wrapper/app/src/main/java/com/deadzone/eclipse/MainActivity.java
          grep -q 'versionCode 5025025' android-wrapper/app/build.gradle
      - name: Compile recovery APK
        run: gradle -p android-wrapper :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare recovery installer
        run: |
          mkdir -p dist
          cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk dist/DeadZone-Eclipse-Recovery-v5.25.24-debug.apk
          test -s dist/DeadZone-Eclipse-Recovery-v5.25.24-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DeadZone-Eclipse-Recovery-v5.25.24-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish recovery Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-recovery-v5.25.24"
          FILE="dist/DeadZone-Eclipse-Recovery-v5.25.24-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --title "DEAD ZONE Android v5.25.24 — recuperación" --notes "Versión Android de recuperación que abre https://deadzone-eclipse-coop-recovery.onrender.com. Se conecta con el antiguo servidor para conservar cuentas y cooperativo, con cliente v5.25.24. APK de prueba con firma debug: Android puede requerir desinstalar versiones previas si sus firmas no coinciden." --prerelease
          fi
