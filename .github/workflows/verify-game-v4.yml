name: Verificar DEAD ZONE v4
on:
  push:
    branches: [main]
    paths:
      - "setup.cjs"
      - "gameplay-v39.cjs"
      - "gameplay-v40.cjs"
      - "gameplay-v41.cjs"
      - "gameplay-v42.cjs"
      - "gameplay-v43.cjs"
      - ".github/workflows/verify-game-v4.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Descargar assets y aplicar parches
        id: game_build
        run: |
          node setup.cjs 2>&1 | tee /tmp/v40-build.log
          exit ${PIPESTATUS[0]}
      - name: Verificar modelos GLB reales
        id: models_check
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const guns=['pistol_compact','pistol_full','smg_compact','smg_full','assault_rifle','battle_rifle','shotgun_pump','shotgun_auto','sniper'];
          guns.push(...guns.map(x=>x+'_east'),'melee_sword','melee_knife','melee_blade');
          guns.push('zombie_mummy','zombie_brute','zombie_witch','zombie_scarecrow','zombie_werewolf','survivor_soldier','dog_kenney','car_kenney');
          for(const gun of guns){
            const buffer=fs.readFileSync('assets/'+gun+'.glb');
            if(buffer.toString('ascii',0,4)!=='glTF'||buffer.byteLength<1024)throw Error('GLB inválido: '+gun);
          }
          console.log('VALIDADOS',guns.length,'MODELOS GLB');
          const src=fs.readFileSync('index.html','utf8');
          for(const token of ['DEAD_ZONE_PATCH_39','DEAD_ZONE_PATCH_40','DEAD_ZONE_PATCH_41','DEAD_ZONE_PATCH_42','DEAD_ZONE_PATCH_43','dz40LoadGun(g,w,lv)','dz41Bullet(bmesh,a2,pl)','dz42InstallEnemy(enemy)','dz43Init','dz43ApplySkin']){
            if(!src.includes(token))throw Error('Parche de juego ausente: '+token);
          }
          console.log('Integración v4 validada');
          NODE
      - name: Verificar sintaxis del JavaScript del juego
        id: syntax_check
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script\s+type="module"\s*>([\s\S]*?)<\/script>/g)];
          if(!scripts.length)throw Error('No se encontró script 3D');
          for(const [,s] of scripts){
            const r=cp.spawnSync(process.execPath,['--check','--input-type=module'],{input:s,encoding:'utf8'});
            if(r.status)throw Error('Sintaxis JS: '+r.stderr);
          }
          console.log('SINTAXIS JS CORRECTA');
          NODE
      - name: Comprobar servidor multijugador
        id: server_check
        run: |
          node server.js > /tmp/dz-v4-server.log 2>&1 &
          echo $! > /tmp/dz-v4.pid
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/health >/tmp/dzhealth && break || sleep 1; done
          cat /tmp/dzhealth
          curl -fsS http://localhost:3000/assets/assault_rifle.glb -o /tmp/dz-rifle.glb
          test -s /tmp/dz-rifle.glb
          node - <<'NODE'
          const host=new WebSocket('ws://127.0.0.1:3000/ws');
          const guests=[];let code='',started=false,received=0,joined=0,finished=false;
          const timer=setTimeout(()=>fail('timeout: '+JSON.stringify({code,joined,started,received})),8500);
          function fail(msg){if(finished)return;finished=true;console.error(msg);for(const ws of [host,...guests])try{ws.close()}catch{};clearTimeout(timer);process.exitCode=1;}
          function done(){if(finished)return;finished=true;console.log('COOP PASS: 4 players, lobby, start and 3 snapshots');for(const ws of [host,...guests])ws.close();clearTimeout(timer);}
          host.addEventListener('open',()=>host.send(JSON.stringify({type:'create',name:'HOST',character:'panda'})));
          host.addEventListener('error',()=>fail('Host failed'));
          host.addEventListener('message',ev=>{
            const m=JSON.parse(ev.data);
            if(m.type==='welcome'&&!code){code=m.code;for(let i=0;i<3;i++){
              const guest=new WebSocket('ws://127.0.0.1:3000/ws');guests.push(guest);
              guest.addEventListener('open',()=>guest.send(JSON.stringify({type:'join',name:'GUEST'+i,character:'panda',code})));
              guest.addEventListener('error',()=>fail('Guest '+i+' failed'));
              guest.addEventListener('message',event=>{
                const n=JSON.parse(event.data);
                if(n.type==='snapshot'){received++;if(received===3)done()}
              });
            }}
            if(m.type==='lobby'&&m.players.length===4&&!started){started=true;host.send(JSON.stringify({type:'start'}))}
            if(m.type==='started'){host.send(JSON.stringify({type:'snapshot',wave:1,spawn:1,zombies:[{id:'test',kind:'normal',x:1,z:1}],gates:[],boss:false}))}
          });
          NODE
          kill "$(cat /tmp/dz-v4.pid)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadzone-v4-build-diagnostics
          path: |
            /tmp/v40-build.log
            /tmp/dz-v4-server.log
          if-no-files-found: ignore
