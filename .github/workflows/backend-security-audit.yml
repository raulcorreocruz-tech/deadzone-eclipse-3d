name: Auditoría cooperativa aislada
on:
  push:
    branches: ["audit/backend-coop-2026-11-11"]
    paths: ["tests/coop-safety-probe.mjs", ".github/workflows/backend-security-audit.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compilar juego en la rama sin publicar
        run: npm install --no-audit --no-fund && node setup.cjs
      - name: Arrancar servidor cooperativo local
        run: |
          node server.js > /tmp/coop-server.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:3000/health >/dev/null; then exit 0;fi;sleep 1;done
          tail -70 /tmp/coop-server.log;exit 1
      - name: Ejecutar pruebas de mensajes y seguridad cooperativa
        run: node tests/coop-safety-probe.mjs
      - name: Guardar hallazgos en la rama aislada
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='coop-security-report.json';
          const r=fs.existsSync(p)?JSON.parse(fs.readFileSync(p)):null;
          fs.writeFileSync('/tmp/report.json',JSON.stringify({runId:process.env.GITHUB_RUN_ID,commit:process.env.GITHUB_SHA,results:r},null,2)+'\n');
          NODE
          BLOB=$(base64 -w0 /tmp/report.json)
          SHA=$(gh api "repos/${{ github.repository }}/contents/backend-audit-result.json?ref=audit/backend-coop-2026-11-11" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then gh api -X PUT "repos/${{ github.repository }}/contents/backend-audit-result.json" -f branch="audit/backend-coop-2026-11-11" -f message="ci: backend audit findings" -f content="$BLOB" -f sha="$SHA" >/dev/null || true
          else gh api -X PUT "repos/${{ github.repository }}/contents/backend-audit-result.json" -f branch="audit/backend-coop-2026-11-11" -f message="ci: backend audit findings" -f content="$BLOB" >/dev/null || true;fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadzone-coop-audit
          path: coop-security-report.json
          if-no-files-found: ignore
