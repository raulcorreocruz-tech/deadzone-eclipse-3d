name: Publicar Dead Zone (web y PWA)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar web
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js icon.svg _site/
          if [ -f weapons.json ]; then cp weapons.json _site/; fi
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir web
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar web y PWA
        id: deployment
        uses: actions/deploy-pages@v4
