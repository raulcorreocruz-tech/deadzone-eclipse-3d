name: Snapshot legacy leaderboard before durable migration
on:
  push:
    branches: ["feature/clean-hud-social-leaderboard-voice-chat-v52518"]
    paths:
      - "tests/snapshot-legacy-scores.mjs"
      - ".github/workflows/snapshot-legacy-scores.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: node tests/snapshot-legacy-scores.mjs
