name: Preserve Dead Zone engine against upstream outages
on:
  workflow_dispatch:
  push:
    branches: [recovery-gateway]
    paths:
      - 'scripts/cache-live-engine.cjs'
      - '.github/workflows/cache-deadzone-engine.yml'
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery-gateway
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and verify source from working game server
        run: node scripts/cache-live-engine.cjs
      - name: Save independent copy into GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot/
          if git diff --cached --quiet; then
            echo "Game snapshot already committed"
          else
            git commit -m "fix(engine): store durable compiled game and critical assets to survive upstream HTTP 429"
            git push origin HEAD:recovery-gateway
          fi
