name: Audit mobile performance hot loops v5.25.19
on:
  push:
    branches: ["perf/mobile-fps-stability-v52519"]
    paths:
      - "tests/inspect-v539.cjs"
      - ".github/workflows/audit-v539.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --no-audit --no-fund && node setup.cjs
      - run: node tests/inspect-v539.cjs
