name: Build Dead Zone Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/deadzone-android-apk.yml'

permissions:
  contents: read

concurrency:
  group: deadzone-android-apk-main
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Compile the debug APK
        run: gradle -p android-wrapper :app:assembleDebug --no-daemon --stacktrace

      - name: Verify generated APK
        run: test -s android-wrapper/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: DeadZone-Eclipse-Android-debug-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
