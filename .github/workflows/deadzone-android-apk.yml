name: Build Dead Zone Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-wrapper/**'
      - 'gameplay-v*.cjs'
      - 'server-v*.cjs'
      - 'setup.cjs'
      - 'package.json'
      - 'release-notes.json'
      - '.github/workflows/deadzone-android-apk.yml'

permissions:
  contents: write

concurrency:
  group: deadzone-android-apk-main
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Ubuntu GitHub runners already include command-line tools. setup-android@v3
      # asks sdkmanager for a removed "tools" package and fails in 2026.
      - name: Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Using Android SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set APK version from current game release
        run: node android-wrapper/sync-version.cjs

      - name: Compile the debug APK
        run: gradle -p android-wrapper :app:assembleDebug --no-daemon --stacktrace

      - name: Verify generated APK
        run: test -s android-wrapper/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare versioned APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk "dist/DeadZone-Eclipse-Android-v$VERSION-debug.apk"
          test -s "dist/DeadZone-Eclipse-Android-v$VERSION-debug.apk"

      - name: Publish downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: DeadZone-Eclipse-Android-v${{ env.VERSION }}-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned APK on GitHub Releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-v$VERSION"
          FILE="dist/DeadZone-Eclipse-Android-v$VERSION-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --title "DEAD ZONE: ECLIPSE Android v$VERSION (pruebas)" --notes "APK Android compilada automáticamente para DEAD ZONE v$VERSION. El juego web se actualiza al abrir la APK con Internet. La instalación de una APK nativa nueva requiere autorización de Android. Esta versión usa firma debug de pruebas; puede requerir desinstalación si difiere de la firma de la aplicación instalada." --prerelease
          fi
