name: QA v5.25.19 Mobile FPS and 50 melee charges
on:
  push:
    branches: ["perf/mobile-fps-stability-v52519"]
    paths:
      - "setup.cjs"
      - "package.json"
      - "gameplay-v539.cjs"
      - "gameplay-v540.cjs"
      - "tests/qa-v539-mobile-melee.mjs"
      - ".github/workflows/qa-v539-mobile.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and full build
        run: |
          node --check gameplay-v539.cjs
          node --check gameplay-v540.cjs
          node --check tests/qa-v539-mobile-melee.mjs
          npm install --no-audit --no-fund
          node setup.cjs
      - name: Melee ammo and mobile game rendering in Chromium
        run: |
          npm install --no-save playwright@1.56.1 --no-audit --no-fund
          PORT=3000 node server.js >/tmp/deadzone-52519.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/health >/dev/null && break; sleep 1; done
          node tests/qa-v539-mobile-melee.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-pc-v52519
          path: dz-52519-*.png
          if-no-files-found: ignore
